<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar - Plataforma Negocio</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="contenedor" style="max-width: 380px; margin-top: 90px;">
    <div class="tarjeta">
      <h1>Plataforma Negocio</h1>
      <p class="subtitulo">Ingresa con tu correo y contraseña.</p>

      <form id="form-login">
        <label for="correo">Correo</label>
        <input type="email" id="correo" required autocomplete="username" />

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" required autocomplete="current-password" />

        <div class="mensaje-error" id="mensaje-error"></div>

        <button type="submit" class="boton-primario" style="width: 100%; margin-top: 8px;">
          Ingresar
        </button>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    document.getElementById("form-login").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const mensajeError = document.getElementById("mensaje-error");
      mensajeError.textContent = "";

      const cuerpo = new URLSearchParams();
      cuerpo.set("username", document.getElementById("correo").value);
      cuerpo.set("password", document.getElementById("contrasena").value);

      try {
        const datos = await apiFetch("/auth/login", { method: "POST", body: cuerpo });
        Sesion.guardar(datos.access_token, datos.rol, datos.nombre_completo);
        window.location.href = "/venta";
      } catch (error) {
        mensajeError.textContent = error.message;
      }
    });
  </script>
</body>
</html>
